name: Publish to PyPI

on:
  push:
    tags:
      - "v*"  # e.g. v2.0.0

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare tag with natquery.__version__
        id: v
        run: |
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*[\"\\']([^\"\\']+)', pathlib.Path('src/natquery/__init__.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match natquery.__version__ ($PKG)"; exit 1
          fi
          grep -q "^## \[$PKG\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $PKG"; exit 1; }
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format check with black
        run: black --check .
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests
        run: pytest --cov=natquery --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f && /^---$/ {next}
            f {print}
          ' CHANGELOG.md > release_notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "pip install natquery==$VERSION"
            echo '```'
            echo
            echo "PyPI: https://pypi.org/project/natquery/$VERSION/"
          } >> release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NatQuery ${{ needs.verify.outputs.version }}
          body_path: release_notes.md
          files: dist/*
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
